name: CI

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

# Staged pipeline: cheap static checks gate the build, which gates the
# expensive race test. A failure in an early stage skips everything downstream.
jobs:
  # ---- Stage 1: static analysis (fast, runs in parallel, no deps) ----
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  # ---- Stage 2: build (gated by all static checks) ----
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [gofmt, vet, tidy, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...

  s3-integration:
    name: S3 backup integration
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Start MinIO
        run: |
          docker run --detach --name amber-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=amber-test \
            --env MINIO_ROOT_PASSWORD=amber-test-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs amber-minio
          exit 1
      - name: Test S3 snapshot round trip
        env:
          AMBER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AMBER_TEST_S3_BUCKET: amber-backup-integration
          AWS_ACCESS_KEY_ID: amber-test
          AWS_SECRET_ACCESS_KEY: amber-test-secret
          AWS_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: go test ./internal/backup -run '^TestS3TransportMinIOIntegration$' -count=1 -timeout=2m
      - name: MinIO logs
        if: failure()
        run: docker logs amber-minio

  # ---- Stage 3: test with the race detector (gated by build) ----
  test:
    name: Test (race)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go test ./... -race -count=1 -timeout=10m

  release-smoke:
    name: Release artifacts and clean-host smoke
    runs-on: ubuntu-latest
    needs: [test, s3-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build release artifacts
        run: make release VERSION=0.4.0-ci
      - name: Verify checksums and CLI surfaces
        run: make release-smoke VERSION=0.4.0-ci
      - name: Clean-host server smoke
        run: |
          work=$(mktemp -d)
          cp config.example.yaml "$work/config.yaml"
          sed -i "s#data_dir: ./data#data_dir: $work/data#" "$work/config.yaml"
          ./dist/0.4.0-ci/amber "$work/config.yaml" >"$work/amber.log" 2>&1 &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz | grep -Fx 'ok'
          curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
          curl --fail --silent http://127.0.0.1:8080/status >/dev/null
          ./dist/0.4.0-ci/amberctl stats --addr http://127.0.0.1:8080 >/dev/null
      - name: Secure amberctl TLS and token-file smoke
        run: |
          work=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$work/server.key" -out "$work/server.crt" >/dev/null 2>&1
          printf 'ci-secret-token\n' >"$work/token"
          cp config.example.yaml "$work/config.yaml"
          sed -i \
            -e "s#http_addr: \"\?[^\" ]*\"\?#http_addr: 127.0.0.1:18080#" \
            -e 's#grpc_addr: .*#grpc_addr: ""#' \
            -e 's#insecure: true#insecure: false#' \
            -e "s#enabled: false#enabled: true#" \
            -e "s#cert_file: \"\"#cert_file: $work/server.crt#" \
            -e "s#key_file: \"\"#key_file: $work/server.key#" \
            -e "s#bearer: \[\]#bearer: [{name: ci, token_file: $work/token}]#" \
            -e "s#data_dir: ./data#data_dir: $work/data#" \
            "$work/config.yaml"
          ./dist/0.4.0-ci/amber "$work/config.yaml" >"$work/amber.log" 2>&1 &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --cacert "$work/server.crt" \
              https://127.0.0.1:18080/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --cacert "$work/server.crt" \
            https://127.0.0.1:18080/healthz >/dev/null
          ./dist/0.4.0-ci/amberctl stats \
            --addr https://127.0.0.1:18080 --token-file "$work/token" \
            --tls-ca "$work/server.crt" >/dev/null

  benchmark:
    name: Query benchmark baseline
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Run release benchmark subset
        run: go test ./benchmarks/ -bench='BenchmarkQuery_FullScan_(1k|10k|100k)$' -benchtime=1s -run='^$' -timeout=10m | tee benchmark-output.txt
      - name: Run mixed-query RSS smoke campaign
        env:
          AMBER_MIXED: "1"
          AMBER_MIXED_SECS: "2"
          AMBER_BENCH_SERIES: "1000"
          AMBER_BENCH_TICKS: "30"
          AMBER_BENCH_FLUSH: "5"
        run: go test ./internal/metricsengine/store/ -run '^TestMixedWorkloadRSS$' -v -count=1 -timeout=10m | tee -a benchmark-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: amber-benchmark-${{ github.sha }}
          path: benchmark-output.txt

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, s3-integration, release-smoke, benchmark]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build and verify release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          make release VERSION="$version"
          (cd "dist/$version" && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/$version/amber" \
            "dist/$version/amberctl" \
            "dist/$version/amber-backup" \
            "dist/$version/amber-migrate" \
            "dist/$version/SHA256SUMS" \
            --verify-tag --generate-notes --title "Amber $GITHUB_REF_NAME"
