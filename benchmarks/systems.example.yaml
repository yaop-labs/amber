# obsbench targets. Copy to systems.yaml and adjust ports.
# protocol: native = the system's own bulk API; otlp = shared protobuf
# payload (same-client fairness baseline, METHODOLOGY.md §5).
targets:
  amber:
    kind: amber
    base_url: http://localhost:8080
    protocol: native
  amber-otlp:
    kind: amber
    base_url: http://localhost:8080
    protocol: otlp
  loki:
    kind: loki
    base_url: http://localhost:3100
    protocol: native
  loki-otlp:
    kind: loki
    base_url: http://localhost:3100
    protocol: otlp
  victorialogs:
    kind: victorialogs
    base_url: http://localhost:9428
    protocol: native
  victorialogs-otlp:
    kind: victorialogs
    base_url: http://localhost:9428
    protocol: otlp
