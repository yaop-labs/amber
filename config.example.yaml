storage:
  data_dir: ./data
  segment_max_records: 100000
  # Считает несжатый serialized payload; проверяется после batch и не является
  # точным лимитом физического размера файла.
  segment_max_bytes: 134217728
  # Amber rejects ingest before ENOSPC and marks readiness false at stop.
  # Warning keeps ingest open but marks runtime status degraded.
  disk_warning_free_bytes: 2147483648
  disk_stop_free_bytes: 1073741824
  index_cache_size: 0
  s3:
    bucket: ""
    prefix: ""
    region: ""
    endpoint: ""
    reconcile_on_start: false

ingest:
  batch_size: 1000
  batch_timeout: 100ms
  queue_size: 100000
  breaker_threshold: 10
  shutdown_timeout: 30s
  max_attrs_per_entry: 64
  max_attr_value_bytes: 4096
  max_attr_keys_per_service: 1024
  max_services: 10000

  # Optional per-signal overrides. Zero/omitted values inherit from ingest.*.
  # Use these when one signal needs tighter isolation without changing the
  # product shape: one binary, separate internal ingest lanes.
  logs:
    batch_size: 0
    batch_timeout: 0s
    queue_size: 0
    breaker_threshold: 0
  spans:
    batch_size: 0
    batch_timeout: 0s
    queue_size: 0
    breaker_threshold: 0

api:
  http_addr: ":8080"
  grpc_addr: ":4317"   # OTLP/gRPC (стандартный порт OTel), оставить пустым чтобы отключить
  # false защищает /metrics тем же Reef bearer token, что и остальные API.
  metrics_public: true
  read_timeout: 30s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 120s
  max_request_bytes: 33554432
  api_key: ""          # Bearer token, пусто = auth выключен
  api_keys: []         # legacy named tokens; api.security.auth is preferred
  security:
    insecure: true     # required for plaintext unauthenticated non-loopback dev listeners
    danger_allow_bearer_over_plaintext: false # explicit danger opt-in when TLS is off
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      client_ca_file: "" # set for mTLS
    auth:
      bearer: []       # [{name: "collector", token_file: "/etc/yaop/tokens/collector"}]

log:
  level: info
  format: text

retention:
  interval: 1h           # интервал проверки (journal, logs и spans)

  # Physical retention of the canonical OTLP replay journal. This is the raw
  # payload/compliance boundary and uses the time Amber accepted each record,
  # not timestamps inside telemetry. It is not S3-tiered. Zero disables a
  # limit; with all three zero the journal grows until a disk/admission limit.
  journal:
    max_age: 0s          # пример: 720h (30 дней)
    max_bytes: 0
    max_segments: 0

  # Per-stream retention. Каждая секция имеет два tier'а:
  #   local_*  — снимает файл с локального диска, объект в S3 остаётся.
  #              Требует настроенного storage.s3. Запрос в эвиктнутый
  #              сегмент прозрачно подтянет его обратно.
  #   max_*    — удаляет сегмент глобально (и из S3). Compliance retention.
  # Все значения 0 = соответствующий tier отключён.
  logs:
    local_max_age: 0s    # пример: 168h (7 дней) — после этого только в S3
    local_max_bytes: 0
    max_age: 0s          # пример: 8760h (год)
    max_bytes: 0
    max_segments: 0

  spans:
    local_max_age: 0s
    local_max_bytes: 0
    max_age: 0s          # обычно короче чем у logs
    max_bytes: 0
    max_segments: 0

metrics:
  enabled: true
  dir: ""
  flush_interval: 0s
  max_buffered_samples: 0
  max_active_series: 0
  max_labels_per_series: 0
  retention: 24h
  compaction_min_blocks: 0
  dogfood_interval: 0s
  # Общий байт-бюджет двух блочных кэшей метрик-движка (декодированные
  # директории + resident-индексы). 0 = вывести из runtime.memory_limit/2,
  # если лимит задан; иначе — дефолты движка (320+384 MiB).
  cache_budget: 0       # пример: 419430400 (400 MiB)

debug:
  pprof: false
  pprof_addr: localhost:6060

runtime:
  # Максимум одновременных rebuild sealed indexes при старте. Один worker
  # удерживает peak memory bootstrap независимым от числа CPU.
  index_bootstrap_workers: 1
  # Soft memory limit рантайма Go в байтах (debug.SetMemoryLimit,
  # аналог GOMEMLIMIT; заданное здесь значение перекрывает env).
  # GC начинает работать агрессивнее при приближении к лимиту —
  # это потолок для пиков RSS ценой чуть большей нагрузки на CPU.
  # 0 = отключено.
  memory_limit: 0       # пример: 838860800 (800 MiB)
